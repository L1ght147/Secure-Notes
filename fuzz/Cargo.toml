[package]
name = "secure-notes-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
secure-notes = { path = "..", features = ["fuzzing"] }

[[bin]]
name = "container_parser"
path = "fuzz_targets/container_parser.rs"
test = false
doc = false
bench = false

[[bin]]
name = "payload_parser"
path = "fuzz_targets/payload_parser.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
