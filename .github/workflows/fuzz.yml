name: Parser fuzz smoke test

on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths: ["src/vault/**", "src/platform/**", "fuzz/**", "Cargo.toml", "Cargo.lock", ".github/workflows/fuzz.yml"]
  pull_request:
    paths: ["src/vault/**", "src/platform/**", "fuzz/**", "Cargo.toml", "Cargo.lock", ".github/workflows/fuzz.yml"]
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  fuzz:
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo install --locked cargo-fuzz
      - run: cargo fuzz run container_parser -- -max_total_time=60
      - run: cargo fuzz run payload_parser -- -max_total_time=60
