[package]
name = "secure-notes"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
publish = false

[dependencies]
arboard = { version = "3.6.1", default-features = false }
blake3 = { version = "1.8.2", features = ["pure"] }
eframe = { version = "=0.35.0", default-features = false, features = ["accesskit", "default_fonts", "glow"] }
libsodium-sys-stable = { version = "=1.24.0", features = ["minimal"] }
rfd = "0.15.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.19"
uuid = { version = "1.24.0", features = ["serde", "v4"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Globalization",
    "Win32_Storage_FileSystem",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Power",
    "Win32_System_RemoteDesktop",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3.23.0"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
